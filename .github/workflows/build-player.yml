name: Build player

on:
  push:
    branches: [main]
    paths:
      - "player/**"
      - ".github/workflows/build-player.yml"
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # needed for the release job on tags

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: player/go.sum

      - name: Build
        working-directory: player
        env:
          CGO_ENABLED: "0"          # modernc sqlite is pure Go; no cgo, cross-compiles cleanly
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          name="gooseneck-player-${GOOS}-${GOARCH}"
          [ "$GOOS" = windows ] && name="${name}.exe"
          go build -trimpath -ldflags "-s -w" -o "../dist/${name}" .
          echo "asset=dist/${name}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gooseneck-player-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.asset }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
